<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora Promedio de Notas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="contenedor">
        <h1>Calculadora de Promedio</h1>
        <p>Ingrese las tres notas del corte para calcular el promedio.</p>

        <label>Nota 1:</label>
        <input type="number" id="nota-1" step="0.1">

        <label>Nota 2:</label>
        <input type="number" id="nota-2" step="0.1">

        <label>Nota 3:</label>
        <input type="number" id="nota-3" step="0.1">

        <button id="boton-calcular" onclick="calcularPromedio()">Calcular</button>

        <p id="texto-promedio"></p>
        <p id="estado-aprovacion"></p>
    </div>

<script>

let  promedioFinal = 0;
let CANTIDAD_NOTAS = 3;

function calcularPromedio() {

    let nota_1 = parseFloat(document.getElementById("nota-1").value);
    let nota_2 = parseFloat(document.getElementById("nota-2").value);
    let nota_3 = parseFloat(document.getElementById("nota-3").value);


    if (isNaN(nota_1) || isNaN(nota_2) || isNaN(nota_3)) {
        document.getElementById("texto-promedio").innerHTML = "Debe ingresar las tres notas.";
        return;
    }

    promedioFinal = (nota_1 + nota_2 + nota_3) / CANTIDAD_NOTAS;

    document.getElementById("texto-promedio").innerHTML = "Promedio: " + promedioFinal.toFixed(2);

    if (promedioFinal >= 3.0) {
        document.getElementById("estado-aprovacion").innerHTML = "Resultado: aprobado";
    } else {
        document.getElementById("estado-aprovacion").innerHTML = "Resultado: reprobado";
    }

}

</script>

</body>
</html>
